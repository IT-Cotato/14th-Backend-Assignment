spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: backend14th
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

# JWT 설정: 시크릿은 backend/.env의 JWT_SECRET으로만 받습니다. (HS256 기준 32바이트 이상)
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000} # 밀리초, 기본 1시간
