spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

jwt:
  # 테스트 전용 값. 실제 서버는 backend/.env 의 JWT_SECRET 을 쓴다
  secret: test-only-secret-key-for-unit-tests-0123456789
  access-token-expiration: 3600000
